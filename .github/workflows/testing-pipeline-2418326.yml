name: Testing Pipeline - Student 2418326

on:
  push:
    branches: [ development, main ]
  pull_request:
    branches: [ development, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: [3.12]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run unit tests (models)
      run: |
        pytest tests/test_models_2418326.py -v --tb=short
      continue-on-error: true
    
    - name: Run route tests (app)
      run: |
        pytest tests/test_app_2418326.py -v --tb=short
      continue-on-error: true
    
    - name: Run integration tests
      run: |
        pytest tests/test_integration_2418326.py -v --tb=short
      continue-on-error: true
    
    - name: Run performance tests
      run: |
        pytest tests/test_performance_2418326.py -v -s
      continue-on-error: true
    
    - name: Run security scan with Bandit
      run: |
        pytest tests/test_security_2418326.py -v -s
      continue-on-error: true
    
    - name: Generate test coverage report
      run: |
        pytest --cov=. --cov-report=term --cov-report=html
      continue-on-error: true
    
    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report
        path: htmlcov/